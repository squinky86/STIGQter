# Review-only fragment for the EXISTING www.stigqter.com TLS server.
# Retain certificate renewal; adjust root and PHP socket for that host.
# Do not apply to the apex Pages host or other websites.
root /var/www/stigqter.com/web;
location = /update.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/update.php;
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;
}
location = /stig.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/stig.php;
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;
}
location = /autostig.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/autostig.php;
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;
}
location = /index.php { return 301 https://stigqter.com/; }
location = /sitemap.php { return 301 https://stigqter.com/sitemap.xml; }
location ~ /\. { deny all; }
location / { return 301 https://stigqter.com$request_uri; }
