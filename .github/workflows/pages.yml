name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'doc/**', 'README.md', 'CHANGES.md', 'SECURITY.md', 'plan-overhaul.md', '.github/workflows/pages.yml', '.github/workflows/content-monitor.yml']
  pull_request:
    branches: [main]
    paths: ['site/**', 'doc/**', 'README.md', 'CHANGES.md', 'SECURITY.md', 'plan-overhaul.md', '.github/workflows/pages.yml', '.github/workflows/content-monitor.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the validated site
        type: boolean
        default: false
  schedule:
    - cron: '47 5 * * 1'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install documentation and compatibility test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-markdown php-cli php-zip
      - name: Build public artifact
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://squinky86.github.io/STIGQter/' }}
        run: |
          python3 site/scripts/build_site.py --base-url "$SITE_BASE_URL"
          python3 site/scripts/check_site.py site/_site --base-url "$SITE_BASE_URL"
          python3 -m unittest discover -s site/scripts -p 'test_*.py'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

  monitor:
    needs: [build, deploy]
    if: always() && (github.event_name == 'schedule' || needs.deploy.result == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.deploy && needs.build.result == 'success'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 site/scripts/monitor.py
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://squinky86.github.io/STIGQter/' }}
          CHECK_LEGACY: ${{ vars.CHECK_LEGACY || 'false' }}
