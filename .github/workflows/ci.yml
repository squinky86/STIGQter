name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows_smoke_run:
        description: Existing CI run whose Windows package should receive startup diagnostics only
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: America/Chicago

jobs:
  linux:
    name: Linux build, tests and package
    if: ${{ !inputs.windows_smoke_run }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: bash scripts/ci/setup.sh linux
      - run: bash scripts/ci/build-linux.sh
      - run: bash scripts/ci/test.sh
      - run: bash scripts/ci/package-linux.sh
      - name: Install and remove the Ubuntu package
        run: |
          sudo apt-get install -y ./.build/dist/*-ubuntu26.04-amd64.deb
          test -x /usr/bin/STIGQter
          ldd /usr/bin/STIGQter | tee .build/results/package-libraries.txt
          ! grep -q 'not found' .build/results/package-libraries.txt
          sudo apt-get remove -y stigqter
          test ! -e /usr/bin/STIGQter
      - uses: actions/upload-artifact@v7
        with:
          name: linux-package
          path: .build/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: .build/results/

  windows:
    name: Static Windows Qt 6.12
    if: ${{ !inputs.windows_smoke_run }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: bash scripts/ci/setup.sh windows
      - name: Compiler identity
        id: compiler
        run: echo "version=$(x86_64-w64-mingw32-g++ -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .build/toolchain/
          key: windows-ubuntu26.04-x64-${{ steps.compiler.outputs.version }}-${{ hashFiles('scripts/ci/sources.json', 'scripts/ci/build-windows.sh', 'scripts/ci/setup.sh', 'scripts/ci/fetch-sources.py') }}
      - run: bash scripts/ci/build-windows.sh
      - run: bash scripts/ci/build-windows-tests.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: .build/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: windows-tests
          path: .build/windows/tests/release/tst_stigqter.exe
          if-no-files-found: error

  windows-test:
    name: Native Windows tests and portable startup
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: .build/dist
      - uses: actions/download-artifact@v8
        with:
          name: windows-tests
          path: .build/windows/tests/release
      - name: Test the static binaries on Windows
        run: python scripts/ci/test-windows.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-test-results
          path: .build/results/
          if-no-files-found: error

  windows-diagnostics:
    name: Windows package diagnostics
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_smoke_run != '' }}
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: .build/dist
          run-id: ${{ inputs.windows_smoke_run }}
          github-token: ${{ github.token }}
      - run: python scripts/ci/test-windows.py --smoke-only
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-diagnostics
          path: .build/results/
          if-no-files-found: error

  codeql:
    name: CodeQL
    if: ${{ !inputs.ref && !inputs.windows_smoke_run && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup.sh linux
      - uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual
          queries: +security-and-quality
      - run: bash scripts/ci/build-linux.sh --app-only
      - uses: github/codeql-action/analyze@v4

  coverage:
    name: Coverage
    if: ${{ !inputs.ref && !inputs.windows_smoke_run && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      COVERAGE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/ci/setup.sh linux
      - uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v8
      - run: bash scripts/ci/build-linux.sh
        env:
          BUILD_WRAPPER: build-wrapper-linux-x86-64
      - run: bash scripts/ci/test.sh
      - name: Coverage reports from the same test execution
        run: |
          mkdir -p .build/coverage
          gcovr --root . --filter src/ --object-directory .build/linux/tests --lcov .build/coverage/lcov.info --sonarqube .build/coverage/sonar.xml
      - uses: SonarSource/sonarqube-scan-action@v8
        if: env.SONAR_TOKEN != ''
        with:
          args: >
            -Dsonar.organization=squinky86
            -Dsonar.projectKey=squinky86_STIGQter
            -Dsonar.sources=src
            -Dsonar.cfamily.compile-commands=.build/bw-output/compile_commands.json
            -Dsonar.coverageReportPaths=.build/coverage/sonar.xml
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: .build/coverage/lcov.info
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            .build/coverage/
            .build/results/
